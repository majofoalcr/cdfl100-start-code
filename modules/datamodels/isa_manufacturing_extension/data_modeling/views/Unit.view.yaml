space: {{ schemaSpace }}
externalId: Unit
name: Unit
description: A collection of associated control modules and/or equipment modules and other process
  equipment in which one or more major processing activities can be conducted. Units are presumed to
  operate on only one batch at a time. Units operate relatively independently of one another. This
  term applies to both the physical equipment and the equipment entity. Examples of major processing
  activities are react, crystallize, and make a solution.
version: {{ enterprise_dm_version }}
properties:
  unitId:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: unitId
    name: Unit id
    description: >
      Unique identifier for the unit entity, conforming to ISA-88 Equipment Model standards.
      A unit represents a basic equipment entity that can carry out one or more processing activities.
      The unitId serves as the primary key and enables traceability of units throughout the
      manufacturing lifecycle. This identifier should align with ISA-88 equipment classification
      standards and support integration with control systems and engineering databases. [ISA-88]
  unitName:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: unitName
    name: Unit name
    description: >
      Human-readable name for the unit, typically describing its processing capability or function
      (e.g., "Reactor Unit 1", "Distillation Column A", "Mixing Unit"). The unitName follows
      ISA-88 naming conventions for units and should be descriptive enough for process engineers
      and operators to understand the unit's function. This name is often used in control system
      displays, batch recipes, and operational documentation. [ISA-88]
  unit_class:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: unit_class
    name: Unit class
    description: >
      Classification of the unit according to its functional class or processing capability,
      following ISA-88 unit classifications. Common unit classes include reactor units, separation
      units, mixing units, heating/cooling units, and transfer units. The unit_class enables
      filtering and analysis by unit function, supports recipe design patterns, and facilitates
      unit reuse across different processes. This classification should follow standardized unit
      class taxonomies for consistency. [ISA-88]
  capacity:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: capacity
    name: Capacity
    description: >
      The maximum processing capacity or throughput of the unit, expressed as a numeric value.
      The capacity represents the unit's design or rated capacity for processing materials, energy,
      or products. This value is critical for production planning, batch sizing, resource
      allocation, and capacity utilization analysis. The capacity should be interpreted in
      conjunction with capacity_unit to determine the complete capacity specification. [ISA-88]
  capacity_unit:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: capacity_unit
    name: Capacity unit
    description: >
      The unit of measure for the capacity value, conforming to standard unit of measure
      conventions (e.g., "kg", "L", "m³/h", "kW"). The capacity_unit provides the dimensional
      context for the capacity numeric value, enabling proper capacity calculations and
      conversions. This field should follow standardized unit naming conventions (e.g., ISO 80000,
      SI units) to ensure consistency and interoperability across systems and organizations. [ISA-88]
  processCell:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: processCell
    name: Process cell
    description: >
      Reference to the parent ProcessCell entity that contains this unit, establishing the ISA-95
      Level 4 hierarchical relationship. The processCell relationship enables navigation from
      unit to process cell level and supports organizational queries across the manufacturing
      hierarchy. This relationship follows ISA-95 parent-child location hierarchy principles,
      ensuring proper containment relationships for functional locations within the process cell
      boundary. [ISA-88, ISA-95 Level 4]
    source:
      space: {{ schemaSpace }}
      externalId: ProcessCell
      version: {{ enterprise_dm_version }}
      type: view
  site:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: site
    name: Site
    description: >
      Denormalized name of the site this unit belongs to, as reported by the source system.
      This duplicates information already derivable via the process cell / production line
      hierarchy, kept here for convenient filtering without traversing the hierarchy.
  src:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: src
    name: Source system
    description: >
      Identifier of the source system that provided this unit record (e.g. "sap"). Provenance
      metadata, not domain data.
  machine_type:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: machine_type
    name: Machine type
    description: >
      Manufacturer/design classification of the physical machine (e.g. "rotary"), distinct from
      unit_class which classifies the unit's ISA-88 processing function. Sourced from the
      "Machine type" metadata field, currently only populated for wrapping-line units.
  function:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: function
    name: Function
    description: >
      Free-text description of the unit's function (e.g. "Ageing Vat"). Sourced from the
      "Function" metadata field, currently only populated for aging-tank units.
  dimensions:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: dimensions
    name: Dimensions
    description: >
      Physical dimensions of the unit as reported by the source system (e.g. "3770x720x1450",
      units vary by source). Coalesced from "Machine dimensions" or "Dimensions (L x W x H), mm"
      depending on machine subtype.
  weight:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: weight
    name: Weight
    description: >
      Weight of the unit as reported by the source system (e.g. "600kg", "1450", "500 kgs" —
      format is not normalized). Coalesced from "Machine weight", "Weight, kg", or "Weight"
      depending on machine subtype.
  output:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: output
    name: Output
    description: >
      Rated production output of the unit as reported by the source system (e.g. "up to 50").
      Sourced from the "Output, bricks/min" metadata field, currently only populated for
      wrapping-line units.
  power:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: power
    name: Power
    description: >
      Power rating of the unit as reported by the source system (e.g. "220V 50/60HZ 2.6KW",
      "4,5" kVA — format is not normalized). Coalesced from "Power", "Rated power input, kVA",
      or "Total installed power (incl. fans) (kW (HP))" depending on machine subtype.
  model:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: model
    name: Model
    description: >
      Manufacturer model number of the unit (e.g. "SA-380CDF"). Sourced from the "Model"
      metadata field, currently only populated for cartoning-line units.
  metadata:
    container:
      space: {{ schemaSpace }}
      externalId: Unit
      type: container
    containerPropertyIdentifier: metadata
    name: Metadata
    description: >
      Remaining source-system metadata not promoted to typed properties (e.g. piping diameters,
      roll/dosing specs, panel thickness), preserved as JSON so no source data is silently
      dropped. Values are equipment-subtype-specific and inconsistent in shape, so they are not
      modeled as first-class properties.
  equipment_modules:
    source:
      space: {{ schemaSpace }}
      externalId: EquipmentModule
      version: {{ enterprise_dm_version }}
      type: view
    through:
      source:
        space: {{ schemaSpace }}
        externalId: EquipmentModule
        version: {{ enterprise_dm_version }}
        type: view
      identifier: unit
    name: Equipment modules
    description: >
      Reverse relationship collection of all ISA Asset entities that are specifically associated
      with this unit through the assetSpecific relationship. This enables the unit to be linked
      to the broader asset hierarchy while maintaining ISA-88 unit relationships. Assets linked
      through this relationship may include equipment, functional locations, or other asset types
      that are operationally scoped to this unit. [ISA-88, ISA-95]
    connectionType: multi_reverse_direct_relation
